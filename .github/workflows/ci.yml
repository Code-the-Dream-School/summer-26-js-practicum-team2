name: CI

on:
  pull_request:
    branches:
      - development
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend lint checks
        run: npm --prefix frontend run lint

      - name: Run frontend test checks
        run: npm --prefix frontend run test

      - name: Run frontend build checks
        run: npm --prefix frontend run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Run backend lint checks
        run: npm --prefix backend run lint

      - name: Run backend test checks
        run: npm --prefix backend run test

      - name: Run backend syntax checks
        run: |
          node --check backend/server.js
          node --check backend/src/app.js

  content-accuracy:
    name: Lesson accuracy metadata check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify accuracy_reviewed_by and accuracy_reviewed_at fields
        run: |
          set -euo pipefail

          missing=0

          while IFS= read -r -d '' file; do
            while IFS= read -r lesson; do
              lesson_id=$(jq -r '.id // "<unknown>"' <<<"$lesson")
              lesson_title=$(jq -r '.title // "<untitled>"' <<<"$lesson")

              if ! jq -e '
                (.accuracy_reviewed_by | type == "string") and
                (.accuracy_reviewed_by | length > 0) and
                (.accuracy_reviewed_at | type == "string") and
                (.accuracy_reviewed_at | length > 0)
              ' <<<"$lesson" >/dev/null; then
                echo "Missing accuracy review metadata: $file :: lesson $lesson_id - $lesson_title"
                missing=1
              fi
            done < <(jq -c '.lessons[]?' "$file")
          done < <(find shared/content -type f -name '*.json' -print0)

          if [ "$missing" -eq 1 ]; then
            echo "One or more lesson files are missing required accuracy metadata fields."
            exit 1
          fi

          echo "All lesson accuracy metadata fields are present and non-empty."
